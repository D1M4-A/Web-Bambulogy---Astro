<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Connectivity Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    pre { background:#111; color:#0f0; padding:12px; border-radius:8px; white-space:pre-wrap; }
    input { width:100%; max-width:720px; margin:6px 0 12px; padding:8px; }
    button { padding:10px 14px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>Supabase Test (GitHub Pages)</h1>
  <p>Isi URL + ANON KEY, lalu klik <b>Run Test</b>.</p>

  <label>Supabase URL (tanpa /rest/v1)</label><br/>
  <input id="url" placeholder="https://xxxx.supabase.co" /><br/>

  <label>Supabase ANON KEY</label><br/>
  <input id="key" placeholder="eyJ... / sb_publishable_..." /><br/>

  <button id="run">Run Test</button>

  <h3>Log</h3>
  <pre id="log">Menunggu test dijalankan...</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const logEl = document.getElementById('log')
    const runBtn = document.getElementById('run')
    const urlEl = document.getElementById('url')
    const keyEl = document.getElementById('key')

    const logs = []
    function log(msg) {
      logs.push(msg)
      logEl.textContent = logs.join('\n')
      console.log(msg)
    }

    function normalizeUrl(u) {
      return u.replace(/\/+$/, '').replace(/\/rest\/v1$/, '')
    }

    function isValidSupabaseUrl(u) {
      return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)
    }

    runBtn.addEventListener('click', async function () {
      logs.length = 0
      log('Mulai test...')

      let SUPABASE_URL = urlEl.value.trim()
      const SUPABASE_ANON_KEY = keyEl.value.trim()

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        log('❌ URL / ANON KEY belum diisi')
        return
      }

      SUPABASE_URL = normalizeUrl(SUPABASE_URL)

      if (!isValidSupabaseUrl(SUPABASE_URL)) {
        log('❌ URL tidak valid. Pakai format: https://xxxx.supabase.co')
        return
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        log('TEST 1: SELECT destinations limit 1')
        const readRes = await supabase.from('destinations').select('id,name').limit(1)
        if (readRes.error) log('❌ READ FAIL: ' + readRes.error.message)
        else log('✅ READ PASS: rows=' + readRes.data.length)

        log('TEST 2: INSERT contact_messages')
        const insRes = await supabase.from('contact_messages').insert([{
          name: 'GitHub Pages Test',
          email: 'test@example.com',
          message: 'Supabase test from GitHub Pages',
          subject: 'Connectivity test'
        }]).select()

        if (insRes.error) log('❌ INSERT FAIL: ' + insRes.error.message)
        else log('✅ INSERT PASS: inserted=' + insRes.data.length)

        log('--- SELESAI ---')
      } catch (e) {
        log('❌ UNCAUGHT ERROR: ' + e.message)
      }
    })
  </script>
</body>
</html>
